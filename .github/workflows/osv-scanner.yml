name: osv-scanner

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]
  schedule:
    # Run daily at 06:00 UTC to catch newly disclosed vulnerabilities
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: read # Required for uploading SARIF results to GitHub Code Scanning
  contents: read
  security-events: write # Required for uploading SARIF results to GitHub Code Scanning

jobs:
  scan:
    name: OSV Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@764c91816374ff2d8fc2095dab36eecd42d61638 # v1.9.2
        continue-on-error: true
        with:
          # Automatically detects lockfiles (package-lock.json, pnpm-lock.yaml, etc.)
          scan-args: |-
            --skip-git
            --recursive
            --output=results.sarif
            --format=sarif
            ./

      - name: Upload SARIF report to GitHub Advanced Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: osv-scanner
