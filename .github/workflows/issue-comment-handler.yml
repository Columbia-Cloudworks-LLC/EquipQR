name: Issue Comment Handler

# Clears status:needs-info when the reporter responds and runs maintainer slash
# commands (/ready, /block, /unblock, /investigate).
# Logic lives in .github/scripts/issue-automation.js.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read # sparse checkout of .github/scripts
  issues: write

# No concurrency group: GitHub keeps only one pending run per group and cancels
# the rest, which would drop events. The script reads live labels, makes
# idempotent writes, and resolves command order from the comment history.

jobs:
  handle:
    name: Handle issue comment
    # Skip pull request comments and bot comments before a runner starts.
    if: ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout automation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Handle comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { runCommentHandler } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/issue-automation.js`);
            await runCommentHandler({ github, context, core });
