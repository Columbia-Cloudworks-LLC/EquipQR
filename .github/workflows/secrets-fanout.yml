name: Configuration name check

# Confirms the preview GitHub environment injects configuration and that the
# Supabase management token is accepted. Does not print secret values and does
# not mutate Vercel or Supabase.
#
# GITHUB_TOKEN cannot list environment secret names (the API returns 403).
# Presence is checked by declaring environment: preview, which this branch
# policy allows. The production environment is limited to main, and its
# release job also deploys, so this workflow does not enter it.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-env:
    name: Preview environment injects configuration
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Confirm a preview secret and variable are set
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: bash dev/ci/assert-preview-env-present.sh

  supabase-auth:
    name: Supabase management token
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: List projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not available to this job."
            exit 0
          fi
          npx --yes supabase projects list >/dev/null
          echo "Supabase management token accepted."
