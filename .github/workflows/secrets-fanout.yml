name: Configuration name check

# Confirms GitHub environment secret names and that the Supabase management
# token is accepted. Does not print secret values and does not mutate Vercel
# or Supabase. Applying values remains an operator step using the GitHub
# environment as the source.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    name: GitHub environment names
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Confirm environment secret names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dev/ci/check-github-environment-names.mjs

  supabase-auth:
    name: Supabase management token
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: List projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not available to this job."
            exit 0
          fi
          npx --yes supabase projects list >/dev/null
          echo "Supabase management token accepted."
