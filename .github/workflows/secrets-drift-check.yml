name: GitHub configuration names

# Daily check that the preview GitHub environment still injects configuration.
# GitHub is the source of truth. This job does not read 1Password and does not
# print values. GITHUB_TOKEN cannot list secret names, so the job declares
# environment: preview instead. Production stays limited to main.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-env:
    name: Preview environment injects configuration
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Confirm a preview secret and variable are set
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: bash dev/ci/assert-preview-env-present.sh
