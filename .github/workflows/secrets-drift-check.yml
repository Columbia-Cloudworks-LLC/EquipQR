name: GitHub configuration names

# Confirms the preview and production GitHub environments still contain the
# secret names recorded in dev/ci/check-github-environment-names.mjs.
# GitHub is the source of truth. This job does not read 1Password.

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    name: Environment secret names
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Confirm environment secret names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dev/ci/check-github-environment-names.mjs
