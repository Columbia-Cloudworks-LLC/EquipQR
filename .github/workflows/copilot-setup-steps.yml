name: "Copilot Setup Steps"

# Runs automatically when this file changes (validation), and on-demand from
# the Actions tab. When Copilot starts a session it executes this job first.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - dev/agent-bootstrap.sh
      - dev/cloud-agent-frontend-setup.sh
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - dev/agent-bootstrap.sh
      - dev/cloud-agent-frontend-setup.sh

jobs:
  # MUST be named exactly `copilot-setup-steps` to be picked up by the agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ── Node / npm ──────────────────────────────────────────────────────────
      # Node 24.x LTS is the supported runtime (aligned with @types/node 24.x).
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit
