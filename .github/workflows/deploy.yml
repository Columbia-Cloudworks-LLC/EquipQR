name: Deploy to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify-deployment:
    name: Notify Deployment
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","Linux"]') || fromJSON('["ubuntu-24.04"]') }}
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Get version from package.json (Linux)
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ] || [ "$VERSION" = "null" ]; then
            echo "❌ Missing version field in package.json"
            exit 1
          fi
          # Validate version format (semver: x.y.z)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must match pattern: x.y.z (e.g., 1.0.0, 2.1.3)"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Deployment notification (Linux)
        shell: bash
        env:
          DEPLOY_REF_NAME: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "🚀 Deployment triggered for $DEPLOY_REF_NAME branch"
          echo "Version: $APP_VERSION"
          echo "Environment: production"
          echo "Vercel will handle the actual deployment automatically"
          echo ""
          echo "Expected URLs:"
          echo "  Production: https://equipqr.app"
          echo "  PR previews: per-PR Vercel URL; preview.equipqr.app aliases latest Preview deployment"

