name: Production Release Readiness

# After a merge to `main`, applies pending Supabase migrations to the production
# project, verifies production schema_migrations alignment (strict drift check),
# waits until the Vercel deployment for the same commit is READY, promotes
# that deployment so equipqr.app serves the new build, then deploys Edge
# Functions last so an earlier failure cannot leave production edge ahead of
# the promoted frontend.
#
# workflow_dispatch defaults to dry-run: it checks that the production
# environment injects credentials and that Supabase and Vercel accept them.
# It does not link a project, push migrations, promote Vercel, or deploy Edge
# Functions. Pass mode=apply to run the release path manually.
#
# Required GitHub production-environment secrets:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_DB_PASSWORD
#   - VERCEL_TOKEN
# plus the Edge secrets and public variables listed in dev/ci/sync-deploy-config.mjs,
# which the release applies to Vercel and Supabase before promoting.
# These jobs are the only workflows that declare environment: production.
# A push to main always applies. Pull requests do not run this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run checks credentials only. apply migrates, promotes, and deploys.
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: ymxkzronkhwxzcdcbnwq

jobs:
  production-credential-check:
    name: Production credentials authenticate
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Confirm production secrets and vendor auth
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error title=production-credential-check::$var is empty. Set it on the production GitHub environment."
              fail=1
            else
              echo "$var is set."
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi
          npx --yes supabase projects list >/dev/null
          echo "Supabase management token accepted."
          vercel_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${VERCEL_TOKEN}" \
            https://api.vercel.com/v2/user)"
          if [[ "$vercel_status" != "200" ]]; then
            echo "::error title=production-credential-check::Vercel token was not accepted (HTTP ${vercel_status})."
            exit 1
          fi
          echo "Vercel token accepted. No project was linked, migrated, promoted, or deployed."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check deployment configuration drift (no writes)
        env:
          SYNC_TARGET: production
          SYNC_MODE: check
          SYNC_VARS_JSON: ${{ toJSON(vars) }}
          # Only the secrets the sync manages (never toJSON(secrets)).
          SYNC_SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SYNC_SECRET_HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          SYNC_SECRET_TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SYNC_SECRET_KDF_SALT: ${{ secrets.KDF_SALT }}
          SYNC_SECRET_INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
          SYNC_SECRET_GOOGLE_WORKSPACE_CLIENT_SECRET: ${{ secrets.GOOGLE_WORKSPACE_CLIENT_SECRET }}
          SYNC_SECRET_GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          SYNC_SECRET_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          SYNC_SECRET_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SYNC_SECRET_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          SYNC_SECRET_GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          SYNC_SECRET_DFY_OPERATOR_USER_IDS: ${{ secrets.DFY_OPERATOR_USER_IDS }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: node dev/ci/sync-deploy-config.mjs

      - name: Check Supabase Auth settings that claiming relies on (no writes)
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: node dev/ci/check-auth-config.mjs

  production-release-readiness:
    name: Migrate, verify schema, promote Vercel, deploy edge
    if: github.event_name == 'push' || inputs.mode == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.72.8

      - name: Verify secrets resolved
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD VERCEL_TOKEN; do
            val="${!var:-}"
            if [[ -z "$val" ]]; then
              echo "::error title=production-release-readiness::$var is empty. Set it on the production GitHub environment."
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            exit 1
          fi

      - name: Check Supabase Auth settings that claiming relies on (no writes)
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: node dev/ci/check-auth-config.mjs

      - name: Apply migrations to production
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Linking production Supabase project..."
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          echo "::notice::Pushing migrations (include-all)..."
          supabase db push --include-all --yes

      - name: Strict production schema drift check
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_BASE_REF: ''
          SCHEMA_DRIFT_STRICT: 'true'
        run: node .github/scripts/check-schema-drift.js

      # GitHub is the only source of configuration. Apply production values to
      # Vercel (VITE_*) and Supabase Edge secrets before promote (triggering a
      # fresh main build when VITE_* values changed) and before the edge deploy.
      - name: Sync deployment configuration from GitHub
        env:
          SYNC_TARGET: production
          SYNC_MODE: apply
          SYNC_REDEPLOY_BRANCH: main
          GITHUB_SHA: ${{ github.sha }}
          SYNC_VARS_JSON: ${{ toJSON(vars) }}
          # Only the secrets the sync manages (never toJSON(secrets)).
          SYNC_SECRET_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SYNC_SECRET_HCAPTCHA_SECRET_KEY: ${{ secrets.HCAPTCHA_SECRET_KEY }}
          SYNC_SECRET_TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          SYNC_SECRET_KDF_SALT: ${{ secrets.KDF_SALT }}
          SYNC_SECRET_INTUIT_CLIENT_SECRET: ${{ secrets.INTUIT_CLIENT_SECRET }}
          SYNC_SECRET_GOOGLE_WORKSPACE_CLIENT_SECRET: ${{ secrets.GOOGLE_WORKSPACE_CLIENT_SECRET }}
          SYNC_SECRET_GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
          SYNC_SECRET_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          SYNC_SECRET_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SYNC_SECRET_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
          SYNC_SECRET_GITHUB_WEBHOOK_SECRET: ${{ secrets.GITHUB_WEBHOOK_SECRET }}
          SYNC_SECRET_DFY_OPERATOR_USER_IDS: ${{ secrets.DFY_OPERATOR_USER_IDS }}
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
        run: node dev/ci/sync-deploy-config.mjs

      - name: Wait for Vercel deployment (main, READY)
        id: wait_vercel
        env:
          VERCEL_TEAM_ID: team_78VeGDURoofThjZNJOKEBpP5
          VERCEL_PROJECT_ID: prj_P9hRun4B2OdGy8ACCnb0f7jNG6UA
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node dev/release/wait-for-vercel-deployment.mjs >> "$GITHUB_OUTPUT"

      - name: Promote Vercel deployment to production
        env:
          VERCEL_TEAM_ID: team_78VeGDURoofThjZNJOKEBpP5
          VERCEL_PROJECT_ID: prj_P9hRun4B2OdGy8ACCnb0f7jNG6UA
          VERCEL_DEPLOYMENT_URL: ${{ steps.wait_vercel.outputs.deployment_url }}
          VERCEL_DEPLOYMENT_ID: ${{ steps.wait_vercel.outputs.deployment_id }}
          GITHUB_SHA: ${{ github.sha }}
          VERCEL_PROMOTE_TIMEOUT: 5m
        run: node dev/release/promote-vercel-production.mjs

      - name: Deploy edge functions to production
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice::Deploying Edge Functions to production ($SUPABASE_PROJECT_REF)..."
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Release readiness summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production release readiness"
            echo ""
            echo "- **Supabase:** migrations applied; strict schema drift check passed; Edge Functions deployed."
            echo "- **Vercel:** main deployment READY and **promoted to production** (\`equipqr.app\`)."
            echo "- **Configuration:** Vercel env and Supabase Edge secrets synced from the GitHub production environment."
            echo "- **Deployment:** ${{ steps.wait_vercel.outputs.deployment_url }}"
            echo ""
            echo "No manual Vercel dashboard promote or \`supabase functions deploy\` is required when this workflow succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
