name: Auto Version Tag

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  tag-version:
    name: Tag Version
    runs-on: ${{ vars.USE_SELF_HOSTED == 'true' && fromJSON('["self-hosted","Linux"]') || fromJSON('["ubuntu-24.04"]') }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Read version from package.json (Linux)
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          
          # Check for missing version field
          if [ -z "$VERSION" ] || [ "$VERSION" = "undefined" ] || [ "$VERSION" = "null" ]; then
            echo "❌ Missing version field in package.json"
            exit 1
          fi
          
          # Validate version format (semver: x.y.z)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must match pattern: x.y.z (e.g., 1.0.0, 2.1.3)"
            exit 1
          fi
          
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "📦 Version from package.json: $VERSION"
          echo "🏷️  Tag to create: $TAG"

      - name: Check if tag exists (Linux)
        id: check-tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "✅ Tag $TAG already exists, skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕 Tag $TAG does not exist, will create it"
          fi

      - name: Create and push tag (Linux)
        if: steps.check-tag.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          
          echo "🏷️  Creating tag: $TAG"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag -a "$TAG" -m "Release v$VERSION"
          
          echo "📤 Pushing tag to origin..."
          git push origin "$TAG"
          echo "✅ Successfully created and pushed tag: $TAG"

      - name: Summary (Linux)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          EXISTS="${{ steps.check-tag.outputs.exists }}"
          
          {
            echo "## Version Tagging Summary"
            echo ""
            echo "**Version:** \`$VERSION\`"
            echo "**Tag:** \`$TAG\`"
            if [ "$EXISTS" = "true" ]; then
              echo "**Status:** Tag already exists, no action taken"
            else
              echo "**Status:** Tag created and pushed successfully"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

